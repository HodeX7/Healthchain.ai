name: Deploy HealthChain Backend API

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy securely via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_IP }}
          username: ${{ secrets.VM_SSH_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "Healthchain.ai" ]; then
              git clone https://github.com/HodeX7/Healthchain.ai.git
            fi
            
            cd Healthchain.ai
            git fetch origin
            git checkout backend
            git reset --hard origin/backend
            
            cd api
            npm install
            
            pm2 restart healthchain-api || pm2 start src/app.js --name "healthchain-api"
            
            echo "✅ Deployment successful. API is running on PM2."
